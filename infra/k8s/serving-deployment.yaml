apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-radar-serving
  namespace: job-radar
  labels:
    app: job-radar
    component: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-radar
      component: serving
  template:
    metadata:
      labels:
        app: job-radar
        component: serving
    spec:
      containers:
        - name: api
          image: job-radar/api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: job-radar-serving-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
