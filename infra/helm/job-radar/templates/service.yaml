apiVersion: v1
kind: Service
metadata:
  name: {{ include "job-radar.fullname" . }}-serving
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "job-radar.labels" . | nindent 4 }}
    component: serving
spec:
  type: {{ .Values.service.type }}
  selector:
    app: job-radar
    component: serving
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
