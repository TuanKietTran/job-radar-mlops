apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "job-radar.fullname" . }}-serving-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "job-radar.labels" . | nindent 4 }}
    component: serving
data:
  MODEL_NAME: {{ .Values.config.modelName | quote }}
  API_PORT: {{ .Values.config.apiPort | quote }}
  JOBS_PATH: {{ .Values.config.jobsPath | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
