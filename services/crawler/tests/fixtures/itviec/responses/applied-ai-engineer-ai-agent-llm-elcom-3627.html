{"@context":"http://schema.org","@type":"JobPosting","industry":"Information Technology","title":"Applied AI Engineer AI Agent, LLM","datePosted":"2026-11-13","validThrough":"2026-12-18","skills":"LLM, Python","description":"Top 3 Reasons To Join Us\r\nMức thu nhập cạnh tranh, xứng đáng với năng lực\r\nBảo hiểm sức khỏe cao cấp, bữa cơm trưa free\r\nMôi trường lành mạnh, văn hóa làm việc thân thiện\r\nThe Job\r\n\u003cp\u003eBạn sẽ xây dựng các hệ thống AI Agent cho dự án chính phủ và doanh nghiệp lớn, nơi dữ liệu phải ở lại trong hạ tầng của khách hàng. Ưu tiên hàng đầu là triển khai on-premise, kết hợp hybrid với cloud khi dữ liệu và quy định cho phép.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eThiết kế và phát triển AI Agent cho nghiệp vụ hành chính công:\u003c/strong\u003e Tự thiết kế kiến trúc agent (single/multi-agent, workflow vs. agent tự trị), code, test và tích hợp các agent xử lý hồ sơ, tra cứu văn bản pháp quy, hỗ trợ soạn thảo và tổng hợp báo cáo.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eXây tool và MCP server:\u003c/strong\u003e Thiết kế tool, MCP server kết nối agent với API, database và hệ thống quản lý văn bản; đảm bảo structured output ổn định, xử lý lỗi/retry, phân quyền và các bước human-in-the-loop.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eSở hữu pipeline RAG:\u003c/strong\u003e Chịu trách nhiệm chất lượng end-to-end cho tài liệu tiếng Việt (văn bản scan, bảng biểu, công văn): parsing/OCR, chunking, embedding, đánh chỉ mục, hybrid search, re-ranking, trích dẫn nguồn — và chứng minh cải tiến bằng số liệu eval.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eTriển khai mô hình on-premise:\u003c/strong\u003e Trực tiếp triển khai các mô hình open-weight thế hệ mới (DeepSeek V4.1, Qwen3.8, GLM-5.3, gpt-oss…) trên hạ tầng GPU của khách hàng, kể cả môi trường mạng nội bộ hoặc air-gapped.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eServing và hạ tầng inference:\u003c/strong\u003e Vận hành và tối ưu inference engine (vLLM, SGLang, TensorRT-LLM) và lớp điều phối (NVIDIA Dynamo, llm-d) trên Kubernetes; tối ưu KV cache, routing, lượng tử hóa (FP8, FP4); benchmark throughput/latency và sizing GPU cho từng dự án.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eKiến trúc hybrid:\u0026nbsp;\u003c/strong\u003eXây model gateway định tuyến giữa mô hình on-premise và cloud theo mức độ nhạy cảm dữ liệu, chi phí và độ trễ.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eEvals và an toàn:\u003c/strong\u003e Xây bộ dữ liệu test, thiết lập eval tự động trong CI, đo độ chính xác và hallucination; triển khai guardrails, lọc dữ liệu cá nhân, audit log theo yêu cầu an toàn thông tin.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eVận hành production:\u0026nbsp;\u003c/strong\u003eThiết lập observability (log, trace, latency, chi phí token); xử lý sự cố, viết postmortem; tối ưu prompt và context dựa trên dữ liệu thực tế.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDẫn dắt kỹ thuật:\u003c/strong\u003e Review code, viết tài liệu thiết kế, hướng dẫn thành viên junior; dùng AI coding agent (Claude Code, Cursor, Codex…) hiệu quả và lan tỏa cách làm cho team.\u003c/li\u003e\u003c/ul\u003e\r\nYour Skills and Experience\r\n\u003cul\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eKinh nghiệm:\u003c/strong\u003e 2–3 năm phát triển phần mềm (Backend, Data hoặc AI/ML), trong đó ít nhất 1 năm làm trực tiếp với LLM/AI Agent.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eProduction LLM:\u003c/strong\u003e Đã đưa ít nhất một hệ thống LLM (RAG hoặc agent) lên production có người dùng thật; trình bày được kiến trúc, các quyết định kỹ thuật, số liệu chất lượng và sự cố đã xử lý.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003ePython và backend vững:\u003c/strong\u003e Thành thạo Python (async, typing, testing); thiết kế REST API (FastAPI hoặc tương đương); làm tốt với SQL và ít nhất một vector database.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eHiểu sâu RAG và Agent:\u003c/strong\u003e Nắm rõ embedding, hybrid search, re-ranking, tool calling, structured output, quản lý context; giải thích được khi nào nên dùng workflow cố định thay vì agent tự trị.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eEvals:\u003c/strong\u003e Đã tự xây bộ eval và dùng số liệu để ra quyết định (đổi model, đổi chunking, đổi prompt…), không chỉ đánh giá cảm tính.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eHạ tầng:\u003c/strong\u003e Sử dụng thành thạo Docker và Linux; có kinh nghiệm triển khai service lên server/Kubernetes.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eAgent framework:\u003c/strong\u003e Đã dùng thực tế ít nhất một framework/SDK: LangGraph, LlamaIndex, OpenAI Agents SDK, Claude Agent SDK, Google ADK…\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eCách làm việc:\u003c/strong\u003e Thành thạo Git, code review, viết tài liệu kỹ thuật; dùng AI coding agent thành thạo; đọc tài liệu và paper tiếng Anh tốt; chủ động, tự chịu trách nhiệm đầu ra.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eBảo mật:\u003c/strong\u003e Có ý thức về an toàn thông tin và bảo vệ dữ liệu cá nhân; sẵn sàng làm việc theo quy trình dự án khu vực công.\u003c/span\u003e\u003cbr\u003e\u003cspan style=\"color:black;\"\u003e\u003cstrong\u003eĐIỂM CỘNG\u003c/strong\u003e\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black;\"\u003eĐã tự host mô hình open-weight bằng vLLM/SGLang/TensorRT-LLM ở quy mô production; hiểu lượng tử hóa FP8/FP4, KV cache, NVIDIA Dynamo hoặc llm-d.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color:black
