<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Chuyên Viên ERP Và Đổi Mới Số","description":"<p>- Giám sát và lên kế hoạch triển khai dự án ERP.<br>- Xây dựng cấu trúc phân quyền và quản trị người dùng.<br>- Xây dựng quy trình, công cụ giúp tối ưu hóa việc kiểm soát, quản trị và vận hành hệ thống ERP.<br>- Phối hợp thiết lập các quy trình, quy định, hướng dẫn thao tác nghiệp vụ trên hệ thống ...phù hợp với hoạt động thực tế.<br>- Liên hệ đối tác để thiết kế phần mềm theo yêu cầu, viết tài liệu đặc tả.<br>- Test lại yêu cầu đảm bảo vận hành được trên hệ thống, đưa hệ thống vào sử dụng.<br>- Hướng dẫn, đào tạo cho người dùng trong quá trình sử dụng phần mềm.<br>- Hỗ trợ sau vận hành.<br>- Quản trị hệ thống dữ liệu.<br>- Các công việc khác do Trưởng phòng phân công.<br><strong>* QUYỀN LỢI:</strong><br><strong>* Lương chính:</strong><br>- Lương thỏa thuận theo năng lực và kinh nghiệm thực tế của ứng viên và các loại phụ cấp theo yêu cầu công việc…;<br>- Lương tháng 13 bằng từ 1-3 tháng lương thỏa thuận.<br>* <strong>Thưởng:</strong><br>- Thưởng định kỳ theo kết quả kinh doanh chung của Tập đoàn theo quý và theo năm;<br>- Thưởng đột xuất theo chương trình chung của Tập đoàn;<br>- Thưởng đột xuất theo thành tích đặc biệt và hoặc các sáng kiến cải tiến trong công việc.<br><strong>* Chế độ đãi ngộ khác</strong>:<br>- Được hưởng đầy đủ các chế độ phúc lợi cơ bản theo quy định của nhà nước ngay sau kết thúc thời gian thử việc bao gồm BHXH, BHYT, BHTN, chế độ Khám sức khỏe định kỳ...;<br>- Được hưởng đầy đủ các chế độ phúc lợi động viên cho bản thân và người thân theo quy định chung của Tập đoàn như Chế độ thăm hỏi; Mừng các ngày lễ trong năm; Mừng ngày thành lập Tập đoàn; Hiếu - hỉ…;<br>- Được hưởng đầy đủ các chế độ phúc lợi nâng cao (dành cho cấp quản lý) như: Mừng danh hiệu quản lý cuối năm, Bảo hiểm sức khỏe cho bản thân và người thân; Chăm sóc sức khỏe (tập thể thao, tập gym…); Hỗ trợ đi lại; Hỗ trợ mua sắm và sử dụng dịch vụ ưu đãi;<br>- Được tham gia các hoạt động ngoại khóa, văn hóa đoàn thể hấp dẫn dành cho CBNV;<br>- Môi trường làm việc chuyên nghiệp, nhân văn, văn hóa và thân thiện.<br><strong>* Thời gian và môi trường làm việc:</strong><br>- Thời gian làm việc: 8h30 - 17h30 hàng ngày từ Thứ 2 đến hết trưa Thứ 7;<br>- Nơi làm việc: Tòa nhà DOJI Tower, Số 05 đường Lê Duẩn, Quận Ba Đình, Thành phố Hà Nội.</p><p>* Kinh nghiệm / Kỹ năng chi tiết:</p><p>- Trình độ: Đại học chuyên ngành CNTT hoặc các chuyên ngành liên quan khác.<br>- Kinh nghiệm 5 năm trở lên, ưu tiên ứng viên có kinh nghiệm về lĩnh vực Logistics.<br>- Tiếng Anh đọc hiểu tài liệu.<br>- Am hiểu về cơ sở dữ liệu, về hệ thống thông tin quản lý tại Doanh nghiệp.<br>- Có kỹ năng thuyết trình tốt, giao tiếp và xử lý các tình huống đột xuất một cách linh hoạt<br>- Kỹ năng thực hiện công việc theo kế hoạch.<br>- Ưu tiên kỹ năng viết quy trình tốt<br>- Chịu được áp lực cao trong công việc</p>","identifier":{"@type":"PropertyValue","name":"CareerLink","value":3676574},"datePosted":"2026-11-12","hiringOrganization":{"@type":"Organization","name":"Tập Đoàn Vàng Bạc Đá Quý DOJI","sameAs":"/viec-lam-cua/tap-doan-vang-bac-da-quy-doji/21398","logo":"https://static.careerlink.vn/image/ff7a619a947cfaa986c2c454f6b3ba1b"},"validThrough":"2026-12-12T23:59:59.000Z","baseSalary":{"@type":"MonetaryAmount","currency":"VND","value":{"@type":"QuantitativeValue","value":"Thương lượng","unitText":"MONTH"}},"experienceRequirements":{"@type":"OccupationalExperienceRequirements","monthsOfExperience":60},"employmentType":"FULL_TIME","industry":"CNTT - Phần mềm, CNTT - Phần cứng / Mạng","jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"Tòa nhà DOJI Tower, Số 5 Lê Duẩn","addressLocality":"Ba Đình","addressRegion":"Hà Nội","postalCode":"11120","addressCountry":"VN"}}],"occupationalCategory":{"@type":"CategoryCode","codeValue":"209","name":"Chuyên viên công nghệ thông tin","inCodeSet":{"@type":"CategoryCodeSet","name" e* Chế độ đãi ngộ khác\u003c/strong\u003e:\u003cbr\u003e- Được hưởng đầy đủ các chế độ phúc lợi cơ bản theo quy định của nhà nước ngay sau kết thúc thời gian thử việc bao gồm BHXH, BHYT, BHTN, chế độ Khám sức khỏe định kỳ...;\u003cbr\u003e- Được hưởng đầy đủ các chế độ phúc lợi động viên cho bản thân và người thân theo quy định chung của Tập đoàn như Chế độ thăm hỏi; Mừng các ngày lễ trong năm; Mừng ngày thành lập Tập đoàn; Hiếu - hỉ…;\u003cbr\u003e- Được hưởng đầy đủ các chế độ phúc lợi nâng cao (dành cho cấp quản lý) như: Mừng danh hiệu quản lý cuối năm, Bảo hiểm sức khỏe cho bản thân và người thân; Chăm sóc sức khỏe (tập thể thao, tập gym…); Hỗ trợ đi lại; Hỗ trợ mua sắm và sử dụng dịch vụ ưu đãi;\u003cbr\u003e- Được tham gia các hoạt động ngoại khóa, văn hóa đoàn thể hấp dẫn dành cho CBNV;\u003cbr\u003e- Môi trường làm việc chuyên nghiệp, nhân văn, văn hóa và thân thiện.\u003cbr\u003e\u003cstrong\u003e* Thời gian và môi trường làm việc:\u003c/strong\u003e\u003cbr\u003e- Thời gian làm việc: 8h30 - 17h30 hàng ngày từ Thứ 2 đến hết trưa Thứ 7;\u003cbr\u003e- Nơi làm việc: Tòa nhà DOJI Tower, Số 05 đường Lê Duẩn, Quận Ba Đình, Thành phố Hà Nội.\u003c/p\u003e36:[\"$\",\"div\",null,{\"className\":\"JobDetail-module__fUiUVq__body\",\"children\":[[\"$\",\"section\",null,{\"className\":\"JobDetail-module__fUiUVq__section\",\"id\":\"section-job-description\",\"children\":[[\"$\",\"h2\",null,{\"children\":\"Mô tả công việc\"}],[\"$\",\"div\",null,{\"data-testid\":\"job-description\",\"children\":[\"$\",\"div\",null,{\"className\":\"text-[15px] leading-7 text-slate-700 [\u0026_a]:text-blue-700 [\u0026_a]:underline [\u0026_b]:font-semibold [\u0026_li]:ml-5 [\u0026_ol]:list-decimal [\u0026_p]:mb-2 [\u0026_strong]:font-semibold [\u0026_table]:w-full [\u0026_ul]:list-disc job-rich-text\",\"dangerouslySetInnerHTML\":{\"__html\":\"$42\"}}]}]]}],[\"$\",\"section\",null,{\"className\":\"JobDetail-module__fUiUVq__section\",\"id\":\"section-job-benefits\",\"children\":[[\"$\",\"h2\", .5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z\"}],\"$undefined\"]}],[\"$\",\"div\",null,{\"className\":\"text-[15px] leading-7 text-slate-700 [\u0026_a]:text-blue-700 [\u0026_a]:underline [\u0026_b]:font-semibold [\u0026_li]:ml-5 [\u0026_ol]:list-decimal [\u0026_p]:mb-2 [\u0026_strong]:font-semibold [\u0026_table]:w-full [\u0026_ul]:list-disc job-rich-text\",\"dangerouslySetInnerHTML\":{\"__html\":\"\u003cp\u003e\u003cstrong\u003e\u003cem\u003e- Các ứng viên quan tâm vui lòng gửi hồ sơ trực tuyến qua hệ thống CareerLink, gửi kèm file hoặc trực tiếp đến tại công ty\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\"}}]]}]]}],[\"$\",\"p\",null,{\"className\":\"pt-3\",\"children\":[\"Nhận hồ sơ bằng ngôn ngữ:\",\" \",[\"$\",\"strong\",null,{\"children\":\"Tiếng Việt\"}]]}]]]}]\n57:Tae3,\u003cp\u003e\u003cstrong\u003eTẬP ĐOÀN VÀNG BẠC ĐÁ QUÝ DOJI, với tiền thân là Công ty Phát triển Công nghệ và Thương mại TTD được thành lập ngày 28/07/1994. Vào thời điểm những năm 90 của thế kỉ 20, Công ty TTD chính là doanh nghiệp tiên phong trong hoạt động chuyên sâu về khai thác đá quý, chế tác cắt mài và xuất khẩu đá quý ra thị trường quốc tế, vốn là một lĩnh vực vô cùng mới mẻ tại Việt Nam. TTD trở thành Công ty đầu tiên đã đưa ra thị trường quốc tế sản phẩm đá Ruby sao Việt Nam với thương hiệu Việt Nam Star Ruby VSR. Kể từ đó, Công ty được mệnh danh là ông hoàng Ruby sao của thế giới, làm cho Việt Nam được khắc họa như một điểm sáng trên bản đồ Đá quý quốc tế. \u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eLiên tiếp từ năm 2009 - 2019, Tập đoàn DOJI không ngừng phát triển vượt trội trong những lĩnh vực bản lề về Vàng bạc Đá quý (trải dài từ các hoạt động Khai thác Mỏ, Chế tác cắt mài Đá quý, Sản xuất hàng Trang sức; Kinh doanh Vàng miếng; Xuất nhập khẩu Vàng, Xây dựng hệ thống chuỗi các Trung tâm Vàng bạc Trang sức trên khắp cả nước và mở rộng đầu tư Bất động sản, các khu dự án tiềm năng, đầu tư trong lĩnh vực du lịch, lấn sân sang lĩnh vực Tài chính Ngân hàng và tái cơ cấu thành công Ngân hàng TMCP TPBank. Tính đến nay, Tập đoàn DOJI có hàng chục Công ty thành viên hoạt động theo mô hình Công ty Mẹ - Con, 5 Công ty liên kết góp vốn và hơn 20 Chi nhánh, gần 100 Trung tâm, Cửa hàng trải dài trên toàn quốc cùng với hơn 400 Đại lý, Điểm bán…, tạo nên hệ thống phân phối sản phẩm phủ khắp hầu hết các vùng miền của Việt Nam. Tổng vốn điều lệ của Tập đoàn là 3.000 tỉ đồng với tổng tài sản là 10.000 tỉ đồng và tổng số lao động là gần 2.000 cán bộ nhân viên. Sự vươn lên mạnh mẽ đã đưa DOJI trở thành Doanh nghiệp được Tổ chức đánh giá xếp hạng VNR 500 xếp hạng là top 5 Doanh nghiệp tư nhân lớn nhất Việt Nam trong một thập kỷ (2010 - 2020). Ngoài ra, trong bảng tổng sắp các doanh nghiệp thuộc mọi thành phẩn kinh tế, DOJI thăng hạng liên tục và hiện nay đứng thứ 17 trong số 500 Doanh nghiệp lớn nhất Việt Nam. Cũng trong 8 năm liên tiếp (2012 - 2019), Tập đoàn được công nhận là Thương hiệu Quốc Gia Việt Nam.   \u003c/strong\u003e\u003c/p\u003e\r\n\u003cdiv class=\"eJOY__extension_root_class\"\u003e \u003c/div\u003e47:[\"$\",\"section\",null,{\"className\":\"JobDetail-module__fUiUVq__section\",\"id\":\"section-about-company\",\"children\":[[\"$\",\"h2\",null,{\"children\":\"Về công ty\"}],[\"$\",\"div\",null,{\"className\":\"mt-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"m-0 text-[18px] font-semibold\",\"children\":[\"$\",\"$L2a\",null,{\"prefetch\":false,\"className\":\"text-inherit no-underline hover:underline\",\"href\":\"/viec-lam-cua/tap-doan-vang-bac-da-quy-doji/21398\",\"title\":\"Tập Đoàn Vàng Bạc Đá Quý DOJI\",\"children\":\"Tập Đoàn Vàng Bạc Đá Quý DOJI\"}]}],[\"$\",\"div\",null,{\"className\":\"mt-1 flex flex-wrap items-center gap-4 text-[14px] text-slate-600\",\"children\":[[\"$\",\"a\",null,{\"className\":\"font-bold text-blue-700 underline\",\"href\":\"http://doji.vn/\",\"rel\":\"nofollow noreferrer\",\"target\":\"_blank\",\"children\":\"http://doji.vn/\"}],[\"$\",\"span\",null,{\"className\":\"flex items-cente
