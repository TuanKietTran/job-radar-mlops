<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"CHUYÊN VIÊN IT","description":"<p>- Lắp đặt, sữa chữa máy tính, mạng và các thiết bị ngoại vi cần thiết như máy in, scan…. </p><p>- Đảm bảo máy tính, mạng, thiêt bị liên quan hoạt động ổn định. </p><p>- Cấu hình các thiết bị router,switch. </p><p>- Cài đặt và hướng dẫn cho người dùng sử dụng phần mềm và thiết bị mới. </p><p>- Sắp xếp và lên lịch nâng cấp và bảo dưỡng hệ thống mà không ảnh hưởng đến thời gian phục vụ khách và làm việc của đồng nghiệp trong công ty. </p><p>- Cài đặt, xử lý lỗi, kiểm tra dữ liệu máy chấm công. </p><p>- Kiểm tra, sửa chữa khóa từ khách sạn, locker ( tủ gửi đồ của khách)</p><p>- Quản lý vận hành hệ thống camera, wifi, truyền hình khách sạn, điện thoại.. </p><p>- Quản lý, bảo trì rạp phim 9D, 12D. </p><p>- Ghi chép nhật ký sữa chữa và bảo dưỡng thiết bị theo quy định. </p><p>- Theo dõi, kiểm kê máy tính, thiết bị và đặt hàng khi có nhu cầu.</p><p><strong><em>- Địa điểm làm việc: Khu Du Lịch Núi Thần Tài, Thôn Phú Túc, Xã Hoà Vang, Thành Phố Đà Nẵng</em></strong></p><p>* Kinh nghiệm / Kỹ năng chi tiết:</p><p>- Có kinh nghiệm làm việc ở vị trí nhân viên IT hoặc vị trí liên quan.</p><p>- Kỹ năng phán đoán và giải quyết vấn đề.</p><p>- Kỹ năng giao tiếp tốt.</p><p>- Kỹ năng tổ chức công việc và quản lý thời gian.</p><p>- Hiểu biết về hệ thống máy tính và mạng.</p><p>- Ưu tiên đã làm việc trong môi trường dịch vụ, khách sạn</p><p>- Tốt nghiệp chuyên ngành CNTT hoặc bằng cấp liên quan.</p><p>- Có năng khiếu bóng đá, văn nghệ là lợi thế.</p>","identifier":{"@type":"PropertyValue","name":"CareerLink","value":3676645},"datePosted":"2026-11-12","hiringOrganization":{"@type":"Organization","name":"CÔNG TY CỔ PHẦN DHC SUỐI ĐÔI","sameAs":"/viec-lam-cua/cong-ty-co-phan-dhc-suoi-doi/400533","logo":"https://blob-careerlinkvn.careerlink.vn/company_logos/50fdaa54ad0a1f77ab383a48f09920d0.png"},"validThrough":"2026-12-12T23:
