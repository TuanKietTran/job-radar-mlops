<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"[Biên Hùng Đồng Nai] Chuyên Viên IT ","description":"<p>- Cài đặt thiết bị, phần mềm của công ty.</p><p>- Hỗ trợ người dùng cuối sử dụng hệ thống CNTT hiệu quả, đảm bảo công việc</p><p>- Quản trị và vận hành hệ thống mạng LAN, WAN, máy chủ</p><p>- Sao lưu và phục hồi ứng dụng</p><p>- Theo dõi, kiểm kê các thiết bị CNTT; tổng hợp, đề xuất nhu cầu trang bị, mua sắm, đi thuê, bảo dưỡng, nâng cấp, sửa chữa, thanh lý các thiết bị CNTT</p><p>- Vận hành và theo dõi tình trạng của các phần mềm ứng dụng</p><p>- Quản lý, cập nhật phiên bản, vá lỗi các chương trình ứng dụng</p><p>- Báo cáo tổng hợp tình trạng các ứng dụng.</p><p>- Đóng góp ý kiến và phản ánh những khó khăn trong quá trình giao dịch để cải tiến quy trình tốt hơn.</p><p><strong>* Thời gian làm việc:</strong> Thứ 2 - CN, off 1 ngày trong tuần.</p><p><strong>* Làm việc tại VNVC Biên Hùng</strong></p><p>* Kinh nghiệm / Kỹ năng chi tiết:</p><p>- Có ít nhất 1 năm kinh nghiệm IT Support.</p>\r\n<p>- Tốt nghiệp chuyên ngành công nghệ thông tin.</p>\r\n<p>- Có kiến thức và kinh nghiệm cơ bản về hệ thống mạng.</p>\r\n<p>- Có kiến thức về hệ điều hành máy tính cá nhân, các dịch vụ hạ tầng Cisco, Firewall, Microsoft (DHCP, DNS,…) và các phần mềm văn phòng.</p>\r\n<p>- Có khả năng giao tiếp, làm việc độc lập và làm việc theo nhóm.</p>\r\n<p>- Có kiến thức về CSDL (SQL Server).</p>\r\n<p>- Ưu tiên: Có khả năng phát triển phần mềm</p>\r\n<p>- Có kinh nghiệm làm Phòng khám, bệnh viện là 1 lợi thế</p>\r\n<p>- Hỗ trợ một số công việc bảo trì khi GĐ yêu cầu</p>","identifier":{"@type":"PropertyValue","name":"CareerLink","value":3677207},"datePosted":"2026-11-13","hiringOrganization":{"@type":"Organization","name":"CÔNG TY CỔ PHẦN VACXIN VIỆT NAM","sameAs":"/viec-lam-cua/cong-ty-co-phan-vacxin-viet-nam/185135","logo":"https://blob-careerlinkvn.careerlink.vn/company_logos/4811e8b0bf44ecd4ea97549877e1ffdb.png"},"validThrough":"2026-12-13  các phần mềm văn phòng.\u003c/p\u003e\\r\\n\u003cp\u003e- Có khả năng giao tiếp, làm việc độc lập và làm việc theo nhóm.\u003c/p\u003e\\r\\n\u003cp\u003e- Có kiến thức về CSDL (SQL Server).\u003c/p\u003e\\r\\n\u003cp\u003e- Ưu tiên: Có khả năng phát triển phần mềm\u003c/p\u003e\\r\\n\u003cp\u003e- Có kinh nghiệm làm Phòng khám, bệnh viện là 1 lợi thế\u003c/p\u003e\\r\\n\u003cp\u003e- Hỗ trợ một số công việc bảo trì khi GĐ yêu cầu\u003c/p\u003e\",\"identifier\":{\"@type\":\"PropertyValue\",\"name\":\"CareerLink\",\"value\":3677207},\"datePosted\":\"2026-11-13\",\"hiringOrganization\":{\"@type\":\"Organization\",\"name\":\"CÔNG TY CỔ PHẦN VACXIN VIỆT NAM\",\"sameAs\":\"/viec-lam-cua/cong-ty-co-phan-vacxin-viet-nam/185135\",\"logo\":\"https://blob-careerlinkvn.careerlink.vn/company_logos/4811e8b0bf44ecd4ea97549877e1ffdb.png\"},\"validThrough\":\"2026-12-13T23:59:59.000Z\",\"baseSalary\":{\"@type\":\"MonetaryAmount\",\"currency\":\"VND\",\"value\":{\"@type\":\"QuantitativeValue\",\"value\":\"Thương lượng\",\"unitText\":\"MONTH\"}},\"experienceRequirements\":{\"@type\":\"OccupationalExperienceRequirements\",\"monthsOfExperience\":12},\"employmentType\":\"FULL_TIME\",\"industry\":\"CNTT - Phần mềm, CNTT - Phần cứng / Mạng, Bảo trì / Sửa chữa\",\"jobLocation\":[{\"@type\":\"Place\",\"address\":{\"@type\":\"PostalAddress\",\"addressLocality\":\"Biên Hòa\",\"addressRegion\":\"Đồng Nai\",\"postalCode\":\"76136\",\"addressCountry\":\"VN\"}}],\"occupationalCategory\":{\"@type\":\"CategoryCode\",\"codeValue\":\"209\",\"name\":\"Chuyên viên công nghệ thông tin\",\"inCodeSet\":{\"@type\":\"CategoryCodeSet\",\"name\":\"CareerLink job catalog v1\"}},\"directApply\":true}3d:[\"$\",\"script\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"$52\"},\"type\":\"application/ld+json\"}]\n3e:[\"$\",\"script\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\
