repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: local
    hooks:
      - id: cicd-check
        name: Offline repository checks
        entry: python3 mlops/cicd/check.py
        language: system
        pass_filenames: false
        always_run: true
