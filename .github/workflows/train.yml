name: train
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset name or path
        required: false
        default: synthetic
      seed:
        description: Deterministic seed
        required: false
        default: '42'
permissions:
  contents: read
concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Run offline checks
        run: python3 mlops/cicd/check.py
      - name: Train or dry-run guard
        run: |
          if [ -f mlops/training/train.py ]; then
            python3 mlops/training/train.py --seed ${{ inputs.seed }} --dataset ${{ inputs.dataset }}
          elif [ -f mlops/training/main.py ]; then
            python3 mlops/training/main.py --seed ${{ inputs.seed }} --dataset ${{ inputs.dataset }}
          else
            echo 'train: no training entry point is present, dry-run guard exits 0'
          fi
