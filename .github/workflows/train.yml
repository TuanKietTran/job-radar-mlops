name: train
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset name or path
        required: false
        default: synthetic
      seed:
        description: Deterministic seed
        required: false
        default: '42'
permissions:
  contents: read
concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Run offline checks
        run: python3 mlops/cicd/check.py
      - name: Train salary model
        run: |
          python3 -m mlops.training.train --model salary --seed ${{ inputs.seed }} --no-metadata --evaluate --out ${{ runner.temp }}/train-salary
