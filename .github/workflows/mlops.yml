name: mlops
on:
  push:
permissions:
  contents: read
concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mlops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Run mlops tests
        run: python3 -m unittest discover -s mlops/tests
      - name: Run end-to-end script
        run: bash mlops/scripts/e2e.sh
