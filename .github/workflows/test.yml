name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Run offline checks
        run: python3 mlops/cicd/check.py
      - name: Run pipeline tests
        run: python3 -m unittest discover -s mlops/cicd/tests -v
      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt
      - name: Run API tests
        run: python3 -m pytest services/api/tests -q
