name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Run offline checks
        run: python3 mlops/cicd/check.py
      - name: Build container images
        run: sh mlops/cicd/build.sh
      - name: Write bill of materials
        run: |
          if command -v syft >/dev/null 2>&1; then
            syft packages dir:. -o spdx-json=mlops/cicd/sbom.spdx.json
          else
            python3 mlops/cicd/sbom.py
          fi
